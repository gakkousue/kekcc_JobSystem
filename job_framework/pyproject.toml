[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job_framework"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A framework for creating and running batch jobs."
requires-python = ">=3.8"
dependencies = [
    # ここに job_framework が直接依存するライブラリを記述
    # 例: "numpy>=1.20"
]

[project.scripts]
# "コマンド名 = パッケージ.モジュール:関数" の形式で指定
batch_run = "job_framework.batch_run:main"